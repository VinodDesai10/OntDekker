# Authentication Service — Alembic configuration
# Documentation: https://alembic.sqlalchemy.org/en/latest/

[alembic]
# Path to migration scripts directory
script_location = alembic

# Prepend the service root to sys.path so 'app' and 'shared' are importable
prepend_sys_path = .

# Template for new migration filenames
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for file_template timestamps
timezone = UTC

# Length of truncated slug in migration filenames
truncate_slug_length = 40

# sqlalchemy.url is intentionally not set here.
# It is read dynamically from app.config.settings.settings.DATABASE_URL
# inside alembic/env.py so that the .env file is the single source of truth.

[post_write_hooks]
# No post-write hooks configured

# ---------------------------------------------------------------------------
# Standard Python logging configuration required by fileConfig()
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

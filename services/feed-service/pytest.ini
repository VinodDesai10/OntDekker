[pytest]
asyncio_mode = auto
testpaths = tests

# Extend sys.path so that `shared` (monorepo root) and the service root
# (for `app.*` imports) are both importable without installing packages.
# Paths are relative to this file (services/feed-service/).
pythonpath = . ../..

python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests — no database or external service required
    integration: Integration tests — requires a live (SQLite in-memory) database
    slow: Tests that are expected to run slowly

# Show short tracebacks by default; -v flag adds per-test names
addopts = --tb=short -q

version: '3.8'

# =============================================================================
# OntDekker — Local Development Docker Compose
#
# Services:
#   - API Gateway: traefik
#   - Infrastructure: postgres, redis, kafka, minio
#   - Microservices: authentication-service, user-service, guide-service,
#                    expedition-service, community-service, feed-service
#   - Frontend: Next.js web app
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # API Gateway — Traefik v2.10
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v2.10
    container_name: ontdekker-traefik
    volumes:
      - ./platform/gateway/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./platform/gateway/dynamic.yml:/etc/traefik/dynamic.yml:ro
    ports:
      - "80:80"
    networks:
      - default
      - ontdekker-gateway

  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — single container, per-service databases
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: ontdekker-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
      - ./infrastructure/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7
    container_name: ontdekker-redis
    ports:
      - "6379:6379"

  # ---------------------------------------------------------------------------
  # Apache Kafka (KRaft mode — no ZooKeeper)
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ontdekker-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible object storage
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: ontdekker-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      # MINIO_SERVER_URL instructs MinIO to embed this URL as the host in all
      # presigned URLs it generates.  Backend services connect to MinIO via the
      # internal hostname (minio:9000), but the presigned URLs returned to the
      # browser must use localhost:9000, which is what browsers can resolve.
      # The HMAC-SHA256 signature is computed by MinIO using this host value, so
      # the signature remains valid when the browser sends the PUT request to
      # localhost:9000.
      MINIO_SERVER_URL: "http://localhost:9000"
      # Allow browser-originated requests (presigned PUT uploads) from the
      # Next.js frontend origin.  The browser makes direct PUT requests to MinIO
      # for community logos and banners — CORS is required for these to succeed.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://localhost"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  # ---------------------------------------------------------------------------
  # Authentication Service
  # ---------------------------------------------------------------------------
  authentication-service:
    build:
      context: .
      dockerfile: services/authentication-service/Dockerfile
    container_name: ontdekker-auth-service
    ports:
      - "8000:8000"
    networks:
      - default
      - ontdekker-gateway
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/auth_db
      JWT_SECRET: dev_secret_key_replace_this_in_production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      REDIS_URL: redis://redis:6379/0
      KAFKA_URL: kafka:29092
      ENVIRONMENT: development
      ALLOWED_ORIGINS: '["http://localhost:3000", "http://localhost", "http://127.0.0.1:3000", "http://127.0.0.1"]'
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USERNAME: "${SMTP_USERNAME:?Set SMTP_USERNAME in .env}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env}"
      SMTP_FROM_EMAIL: "${SMTP_FROM_EMAIL:?Set SMTP_FROM_EMAIL in .env}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-OntDekker}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-true}"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.core.main:app --host 0.0.0.0 --port 8000"

  # ---------------------------------------------------------------------------
  # User Service
  # ---------------------------------------------------------------------------
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: ontdekker-user-service
    ports:
      - "8001:8000"
    networks:
      - default
      - ontdekker-gateway
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/user_db
      JWT_SECRET: dev_secret_key_replace_this_in_production
      JWT_ALGORITHM: HS256
      REDIS_URL: redis://redis:6379/0
      KAFKA_URL: kafka:29092
      ENVIRONMENT: development
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_USE_SSL: "false"
      MINIO_BUCKET_PROFILES: profiles
      MINIO_MAX_FILE_SIZE: 5242880
      ALLOWED_ORIGINS: '["http://localhost:3000", "http://localhost", "http://127.0.0.1:3000", "http://127.0.0.1"]'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    command: >
      sh -c "alembic upgrade head && uvicorn app.core.main:app --host 0.0.0.0 --port 8000"

  # ---------------------------------------------------------------------------
  # Guide Service
  # ---------------------------------------------------------------------------
  guide-service:
    build:
      context: .
      dockerfile: services/guide-service/Dockerfile
    container_name: ontdekker-guide-service
    ports:
      - "8002:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/guide_db
      ENVIRONMENT: development
      JWT_SECRET: dev_secret_key_replace_this_in_production
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Expedition Service
  # ---------------------------------------------------------------------------
  expedition-service:
    build:
      context: .
      dockerfile: services/expedition-service/Dockerfile
    container_name: ontdekker-expedition-service
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/trip_db
      ENVIRONMENT: development
      JWT_SECRET: dev_secret_key_replace_this_in_production
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Community Service
  # ---------------------------------------------------------------------------
  community-service:
    build:
      context: .
      dockerfile: services/community-service/Dockerfile
    container_name: ontdekker-community-service
    ports:
      - "8004:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/community_db
      JWT_SECRET: dev_secret_key_replace_this_in_production
      JWT_ALGORITHM: HS256
      SERVICE_NAME: community-service
      ENVIRONMENT: development
      # Internal endpoint: used for backend-to-MinIO SDK communication inside Docker
      MINIO_ENDPOINT: minio:9000
      # Public endpoint: embedded in permanent media URLs returned to the browser.
      # Must match the host:port the browser can reach (MinIO's port-mapped address).
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      # Must match MINIO_ROOT_PASSWORD set on the minio service above
      MINIO_SECRET_KEY: minioadmin123
      KAFKA_URL: kafka:29092
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: '["http://localhost:3000", "http://localhost", "http://127.0.0.1:3000", "http://127.0.0.1"]'
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: on-failure
    command: >
      sh -c "alembic upgrade head && uvicorn app.core.main:app --host 0.0.0.0 --port 8000"

  # ---------------------------------------------------------------------------
  # Feed Service
  # ---------------------------------------------------------------------------
  feed-service:
    build:
      context: .
      dockerfile: services/feed-service/Dockerfile
    container_name: ontdekker-feed-service
    ports:
      - "8005:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/feed_db
      JWT_SECRET: dev_secret_key_replace_this_in_production
      JWT_ALGORITHM: HS256
      SERVICE_NAME: feed-service
      ENVIRONMENT: development
      # Internal endpoint: used for backend-to-MinIO SDK communication inside Docker
      MINIO_ENDPOINT: minio:9000
      # Public endpoint: embedded in presigned URLs returned to the browser
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      KAFKA_URL: kafka:29092
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: on-failure
    command: >
      sh -c "alembic upgrade head && uvicorn app.core.main:app --host 0.0.0.0 --port 8000"

  # ---------------------------------------------------------------------------
  # Frontend — Next.js web application
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: apps/web
      dockerfile: Dockerfile
    container_name: ontdekker-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost
    depends_on:
      - guide-service
      - expedition-service
      - authentication-service
      - user-service
      - community-service
      - feed-service
    restart: on-failure

volumes:
  postgres_data:
  minio_data:

networks:
  ontdekker-gateway:
    driver: bridge
